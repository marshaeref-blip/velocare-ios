name: Build Unsigned iOS IPA for Sideloadly

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    name: Build iOS IPA
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate native iOS project (Expo Prebuild)
        run: npx expo prebuild --platform ios

      - name: Install CocoaPods
        run: |
          cd ios
          pod install

      - name: Build Archive (Unsigned)
        run: |
          xcodebuild -workspace ios/VeloCare.xcworkspace \
            -scheme VeloCare \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/VeloCare.xcarchive \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            clean archive

      - name: Package Payload into .IPA
        run: |
          mkdir -p build/Payload
          cp -r build/VeloCare.xcarchive/Products/Applications/VeloCare.app build/Payload/
          cd build
          zip -r VeloCare.ipa Payload

      - name: Upload VeloCare.ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VeloCare-iOS-IPA
          path: build/VeloCare.ipa
          retention-days: 7
